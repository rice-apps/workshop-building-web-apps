<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RiceApps · Projects</title>
  <link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
  <main>
    <header><h1>RiceApps</h1><p>A fictional team, built together.</p></header>
    <nav aria-label="Pages"><a href="/ui/members.html">Members</a><a href="/ui/projects.html">Projects</a></nav>
    <section>
      <h2>Add a project</h2>
      <div id="project-form">
        <label for="name">Project name</label>
        <input id="name" name="name" required maxlength="80" autocomplete="off">
        <button id="add-project" class="primary-button">Add project</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
    <section>
      <div class="list-heading"><h2>Projects</h2><button id="reload" type="button">Reload list</button></div>
      <ul id="list"></ul>
    </section>
    <footer>Fictional data only · stored in SQLite on this server</footer>
  </main>
  <script type="module" src="/event-handlers/projects.ts"></script>
</body>
</html>
