<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RiceApps · Members</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <header>
        <span class="eyebrow">RICEAPPS / DEV WORKSHOP 02</span>
        <h1>Build something together.</h1>
        <p>A fictional team. A real path from browser to database.</p>
      </header>
      <nav aria-label="Pages">
        <a href="/">Members</a
        ><a href="/projects.html">Projects reference ↗</a>
      </nav>
      <p id="storage" class="badge">Checking server storage…</p>
      <section>
        <h2>Add a member</h2>
        <p id="stage"></p>
        <form id="member-form">
          <label for="name">Member name</label
          ><input
            id="name"
            name="name"
            required
            maxlength="80"
            placeholder="Demo Member A"
            autocomplete="off"
          /><label for="class-year">Class year</label
          ><input
            id="class-year"
            name="class_year"
            type="number"
            min="2000"
            max="2100"
            value="2028"
            required
          /><label for="role">Role</label
          ><select id="role" name="role">
            <option value="developer">Developer</option>
            <option value="designer">Designer</option></select
          ><!-- STEP 2: add a submit button, using projects.html as the reference. -->
        </form>
        <p id="status" role="status" aria-live="polite"></p>
      </section>
      <section>
        <div class="list-heading">
          <h2>Members</h2>
          <button id="reload" type="button">Reload list</button>
        </div>
        <ul id="list"></ul>
      </section>
      <footer>
        HTML → TypeScript → HTTP → FastAPI → storage<br />Fictional data only ·
        October 7 · Omar + Mac
      </footer>
    </main>
    <script type="module" src="/members.ts"></script>
  </body>
</html>
